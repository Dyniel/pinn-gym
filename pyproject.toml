[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-gym"
version = "0.1.0"
description = "An open-source numerical gym for physics-informed design of printable energy-absorbing lattice metamaterials."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Daniel Cieslak", email = "cieslak.a.daniel@gmail.com" },
]
keywords = [
    "physics-informed-neural-networks",
    "lattice-metamaterials",
    "energy-absorption",
    "scientific-reports",
    "reproducible-benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-image>=0.22",
    "trimesh>=4.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
pinn-gym = "pinn_gym.cli:main"

[project.urls]
Repository = "https://github.com/Dyniel/pinn-gym"
Documentation = "https://github.com/Dyniel/pinn-gym/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pinn_gym = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
